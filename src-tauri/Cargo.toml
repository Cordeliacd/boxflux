[package]
name = "boxflux"
version = "0.4.1"
description = "BoxFlux — Advanced File Optimization & Conversion (Tauri 2 desktop app)"
authors = ["Box Studio"]
license = "MIT"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
name = "boxflux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
parking_lot = "0.12"

rayon = "1"

thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

# Codecs: PNG (oxipng/zopfli), JPEG (mozjpeg), WebP (webpx), AVIF (ravif).
# `image` decodifica/activa paralelismo; con `avif-native` el decode AVIF
# va por dav1d (requiere libdav1d >= 1.0 en build y runtime).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "avif", "avif-native", "rayon"] }
# `png` directo: el encoder de PNGs indexed (paleta) que `image` no expone.
png = "0.17"
oxipng = { version = "9.1", default-features = false, features = ["zopfli"] }
mozjpeg = { version = "0.10", features = ["parallel"] }
webpx = "0.4"
# Sin `asm` para compilar sin NASM: el encoder AVIF es ~30% más lento
# pero no exige dependencias del sistema.
ravif = { version = "0.11", default-features = false }
rgb = "0.8"
kamadak-exif = "0.5"
imgref = "1.11"

# Métrica perceptual (BSD-3): decide "visualmente idéntico" mejor que SSIM.
butteraugli = "0.9"

# PNG lossy opcional. imagequant es GPL-3.0: habilitar `png-lossy` solo
# si aceptas esa licencia (o compraste la comercial de ImageOptim).
imagequant = { version = "4.4", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
png-lossy = ["dep:imagequant"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# unwind: un panic dentro de un codec queda aislado en el job (Failed)
# en vez de matar la app y perder la cola entera.
panic = "unwind"

[profile.dev]
opt-level = 0
debug = true

[profile.relwithdebinfo]
inherits = "release"
strip = "none"
debug = true
